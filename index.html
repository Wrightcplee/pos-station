<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>POS Station</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #f6f4f1;
    --fg: #1a1a1a;
    --surface: #ffffff;
    --surface-alt: #edeae6;
    --border: #d9d5cf;
    --muted: #7a7570;
    --accent: #d4762c;
    --accent-hover: #be6820;
    --confirm: #2d8a4e;
    --confirm-hover: #247a42;
    --danger: #c4402a;
    --danger-hover: #a8351f;
    --header-bg: #1e1e1e;
    --header-fg: #f0ede8;
    --badge-bg: #d4762c;
    --badge-fg: #ffffff;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414;
      --fg: #e8e4df;
      --surface: #1e1e1e;
      --surface-alt: #2a2a2a;
      --border: #3a3a3a;
      --muted: #8a8580;
      --accent: #e8943e;
      --accent-hover: #d4862e;
      --confirm: #3aad62;
      --confirm-hover: #2d9a52;
      --danger: #e05040;
      --danger-hover: #c84535;
      --header-bg: #0a0a0a;
      --header-fg: #e8e4df;
      --badge-bg: #e8943e;
      --badge-fg: #1a1a1a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414;
    --fg: #e8e4df;
    --surface: #1e1e1e;
    --surface-alt: #2a2a2a;
    --border: #3a3a3a;
    --muted: #8a8580;
    --accent: #e8943e;
    --accent-hover: #d4862e;
    --confirm: #3aad62;
    --confirm-hover: #2d9a52;
    --danger: #e05040;
    --danger-hover: #c84535;
    --header-bg: #0a0a0a;
    --header-fg: #e8e4df;
    --badge-bg: #e8943e;
    --badge-fg: #1a1a1a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    background: var(--header-bg);
    color: var(--header-fg);
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: 56px;
    flex-shrink: 0;
    gap: 16px;
    z-index: 100;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .header-tabs {
    display: flex;
    gap: 4px;
    margin-left: 24px;
  }
  .header-tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }
  .header-tab:hover { background: rgba(255,255,255,0.08); color: var(--header-fg); }
  .header-tab.active { background: rgba(255,255,255,0.12); color: var(--header-fg); }

  .main { flex: 1; overflow: hidden; display: flex; }

  .pos-view { display: flex; flex: 1; overflow: hidden; }
  .menu-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .category-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .category-label:first-child { margin-top: 0; }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .menu-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .menu-item:active { transform: scale(0.97); }
  .menu-item-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }
  .menu-item-price {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  .cart-sidebar {
    width: 340px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .cart-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-count {
    background: var(--badge-bg);
    color: var(--badge-fg);
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: var(--font-mono);
  }
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .cart-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 14px; font-weight: 500; }
  .cart-item-price { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .cart-qty {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--fg);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    transition: background 0.1s;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .qty-btn:hover { background: var(--border); }
  .qty-btn.danger:hover { background: var(--danger); color: #fff; }
  .qty-val {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }
  .cart-item-total {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    min-width: 60px;
    text-align: right;
  }
  .cart-footer {
    border-top: 2px solid var(--border);
    padding: 16px 20px;
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .cart-total-label { font-size: 16px; font-weight: 700; }
  .cart-total-value {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .cart-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-clear {
    background: var(--surface-alt);
    color: var(--fg);
    flex: 0;
    white-space: nowrap;
  }
  .btn-clear:hover { background: var(--border); }
  .btn-confirm {
    background: var(--confirm);
    color: #fff;
  }
  .btn-confirm:hover { background: var(--confirm-hover); }
  .btn-confirm:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .history-view {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: none;
  }
  .history-view.active { display: block; }
  .pos-view.active { display: flex; }
  .history-empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 15px;
  }
  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-invoice {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }
  .history-date {
    font-size: 13px;
    color: var(--muted);
  }
  .history-total {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }
  .history-items-list {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .history-actions { display: flex; gap: 8px; }
  .btn-sm {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-edit {
    background: var(--accent);
    color: #fff;
  }
  .btn-edit:hover { background: var(--accent-hover); }
  .history-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-alt);
    color: var(--muted);
  }
  .history-badge.edited {
    background: #fdf0e0;
    color: #9a6020;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .history-badge.edited { background: #3a2a10; color: #e8b860; }
  }
  :root[data-theme="dark"] .history-badge.edited { background: #3a2a10; color: #e8b860; }

  .history-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .history-toolbar-title {
    font-size: 16px;
    font-weight: 700;
  }
  .history-toolbar-actions { display: flex; gap: 8px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay[hidden] { display: none !important; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--muted);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--surface-alt); }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .export-textarea {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--bg);
    color: var(--fg);
    resize: vertical;
    line-height: 1.5;
  }
  .export-textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--header-bg);
    color: var(--header-fg);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 300;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: var(--danger); }

  @media (max-width: 700px) {
    .pos-view { flex-direction: column; }
    .cart-sidebar {
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--border);
      max-height: 45vh;
    }
    .menu-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    }
    .header h1 { font-size: 15px; }
    .header-tabs { margin-left: 12px; }
    .header-tab { padding: 6px 10px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>POS</h1>
  <div class="header-tabs">
    <button class="header-tab active" onclick="switchView('pos')">Order</button>
    <button class="header-tab" onclick="switchView('history')">History</button>
  </div>
</div>

<div class="main">
  <div class="pos-view active" id="posView">
    <div class="menu-area" id="menuArea"></div>
    <div class="cart-sidebar">
      <div class="cart-header">
        <span>Current Order</span>
        <span class="cart-count" id="cartCount">0</span>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="cart-empty">Tap a menu item to add it</div>
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-value" id="cartTotal">$0.00</span>
        </div>
        <div class="cart-actions">
          <button class="btn btn-clear" onclick="clearCart()">Clear</button>
          <button class="btn btn-confirm" id="confirmBtn" onclick="confirmOrder()" disabled>Confirm Order</button>
        </div>
      </div>
    </div>
  </div>

  <div class="history-view" id="historyView"></div>
</div>

<div class="modal-overlay" id="exportModal" hidden>
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title">Export Orders</span>
      <button class="modal-close" onclick="closeExport()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn-sm btn-edit" id="exportCsvTab" onclick="setExportFormat('csv')" style="opacity:1">CSV</button>
        <button class="btn-sm btn-edit" id="exportJsonTab" onclick="setExportFormat('json')" style="opacity:0.5">JSON</button>
      </div>
      <textarea class="export-textarea" id="exportContent" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-clear" onclick="closeExport()">Close</button>
      <button class="btn btn-confirm" onclick="copyExport()">Copy to Clipboard</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal" hidden>
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title" id="editModalTitle">Edit Order</span>
      <button class="modal-close" onclick="closeEdit()">&times;</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-clear" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-confirm" id="editSaveBtn" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MENU = [
  { category: 'Mains', items: [
    { name: 'Grilled Chicken', price: 16.50 },
    { name: 'Beef Burger', price: 14.00 },
    { name: 'Fish & Chips', price: 15.00 },
    { name: 'Pasta Carbonara', price: 13.50 },
    { name: 'Steak Sandwich', price: 18.00 },
    { name: 'Veggie Wrap', price: 12.00 },
    { name: 'Lamb Chops', price: 22.00 },
    { name: 'Caesar Salad', price: 11.50 },
  ]},
  { category: 'Sides', items: [
    { name: 'Chips', price: 5.00 },
    { name: 'Garden Salad', price: 6.00 },
    { name: 'Garlic Bread', price: 4.50 },
    { name: 'Sweet Potato Fries', price: 6.50 },
    { name: 'Coleslaw', price: 4.00 },
    { name: 'Onion Rings', price: 5.50 },
  ]},
  { category: 'Drinks', items: [
    { name: 'Soft Drink', price: 3.50 },
    { name: 'Coffee', price: 4.50 },
    { name: 'Fresh Juice', price: 6.00 },
    { name: 'Water', price: 2.50 },
    { name: 'Milkshake', price: 7.00 },
    { name: 'Iced Tea', price: 4.00 },
  ]},
  { category: 'Desserts', items: [
    { name: 'Brownie', price: 8.00 },
    { name: 'Cheesecake', price: 9.50 },
    { name: 'Ice Cream', price: 6.00 },
    { name: 'Fruit Salad', price: 7.00 },
  ]},
];

let cart = [];
let orders = [];
let editingOrder = null;
let editCart = [];
let exportFormat = 'csv';

function loadData() {
  try { orders = JSON.parse(localStorage.getItem('pos_orders') || '[]'); } catch(e) {}
}

function saveOrders() {
  try { localStorage.setItem('pos_orders', JSON.stringify(orders)); } catch(e) {}
}

function generateInvoiceId() {
  const now = new Date();
  const d = now.toISOString().slice(0,10).replace(/-/g,'');
  const seq = String(orders.filter(o => o.id.startsWith('INV-' + d)).length + 1).padStart(3, '0');
  return 'INV-' + d + '-' + seq;
}

function fmt(n) { return '$' + n.toFixed(2); }

function renderMenu() {
  document.getElementById('menuArea').innerHTML = MENU.map(cat =>
    '<div class="category-label">' + cat.category + '</div>' +
    '<div class="menu-grid">' +
    cat.items.map(item =>
      '<div class="menu-item" onclick="addToCart(\'' + item.name + '\', ' + item.price + ')">' +
        '<span class="menu-item-name">' + item.name + '</span>' +
        '<span class="menu-item-price">' + fmt(item.price) + '</span>' +
      '</div>'
    ).join('') +
    '</div>'
  ).join('');
}

function addToCart(name, price) {
  var existing = cart.find(function(i) { return i.name === name; });
  if (existing) { existing.qty++; }
  else { cart.push({ name: name, price: price, qty: 1 }); }
  renderCart();
}

function updateQty(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) cart.splice(index, 1);
  renderCart();
}

function clearCart() { cart = []; renderCart(); }

function getTotal(items) {
  return items.reduce(function(sum, i) { return sum + i.price * i.qty; }, 0);
}

function renderCart() {
  var container = document.getElementById('cartItems');
  var total = getTotal(cart);
  var count = cart.reduce(function(s, i) { return s + i.qty; }, 0);

  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('confirmBtn').disabled = cart.length === 0;

  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Tap a menu item to add it</div>';
    return;
  }

  container.innerHTML = cart.map(function(item, i) {
    return '<div class="cart-item">' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-name">' + item.name + '</div>' +
        '<div class="cart-item-price">' + fmt(item.price) + ' ea</div>' +
      '</div>' +
      '<div class="cart-qty">' +
        '<button class="qty-btn ' + (item.qty === 1 ? 'danger' : '') + '" onclick="updateQty(' + i + ', -1)">' + (item.qty === 1 ? '&#10005;' : '&#8722;') + '</button>' +
        '<span class="qty-val">' + item.qty + '</span>' +
        '<button class="qty-btn" onclick="updateQty(' + i + ', 1)">+</button>' +
      '</div>' +
      '<div class="cart-item-total">' + fmt(item.price * item.qty) + '</div>' +
    '</div>';
  }).join('');
}

function confirmOrder() {
  if (cart.length === 0) return;
  var order = {
    id: generateInvoiceId(),
    items: cart.map(function(i) { return { name: i.name, price: i.price, qty: i.qty }; }),
    total: getTotal(cart),
    date: new Date().toISOString(),
    edited: false,
  };
  orders.unshift(order);
  saveOrders();
  cart = [];
  renderCart();
  showToast(order.id + ' confirmed');
}

function renderHistory() {
  var view = document.getElementById('historyView');
  if (orders.length === 0) {
    view.innerHTML = '<div class="history-empty">No orders yet</div>';
    return;
  }

  var html = '<div class="history-toolbar">' +
    '<span class="history-toolbar-title">' + orders.length + ' order' + (orders.length !== 1 ? 's' : '') + '</span>' +
    '<div class="history-toolbar-actions">' +
      '<button class="btn-sm btn-edit" onclick="openExport()">Export All</button>' +
    '</div></div>';

  html += orders.map(function(order, idx) {
    var d = new Date(order.date);
    var dateStr = d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    var itemsStr = order.items.map(function(i) { return i.qty + '× ' + i.name; }).join(', ');
    return '<div class="history-card">' +
      '<div class="history-header">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          '<span class="history-invoice">' + order.id + '</span>' +
          (order.edited ? '<span class="history-badge edited">Edited</span>' : '') +
        '</div>' +
        '<span class="history-total">' + fmt(order.total) + '</span>' +
      '</div>' +
      '<div class="history-date" style="margin-bottom:8px">' + dateStr + '</div>' +
      '<div class="history-items-list">' + itemsStr + '</div>' +
      '<div class="history-actions">' +
        '<button class="btn-sm btn-edit" onclick="openEdit(' + idx + ')">Edit Order</button>' +
      '</div>' +
    '</div>';
  }).join('');

  view.innerHTML = html;
}

function generateCsv() {
  function escape(v) {
    var s = String(v);
    return (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  var rows = ['Invoice ID,Date,Time,Item,Qty,Unit Price,Line Total,Order Total,Status'];
  orders.forEach(function(order) {
    var d = new Date(order.date);
    var dateStr = d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
    var timeStr = d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var status = order.edited ? 'Edited' : 'Original';
    order.items.forEach(function(item) {
      rows.push([order.id, dateStr, timeStr, escape(item.name), item.qty,
        item.price.toFixed(2), (item.price * item.qty).toFixed(2),
        order.total.toFixed(2), status].join(','));
    });
  });
  return rows.join('\n');
}

function generateJson() {
  return JSON.stringify(orders.map(function(order) {
    return {
      invoiceId: order.id,
      timestamp: order.date,
      items: order.items.map(function(i) {
        return { name: i.name, qty: i.qty, unitPrice: i.price, lineTotal: i.price * i.qty };
      }),
      total: order.total,
      edited: order.edited,
      editedAt: order.editedDate || null,
    };
  }), null, 2);
}

function setExportFormat(f) {
  exportFormat = f;
  document.getElementById('exportCsvTab').style.opacity = f === 'csv' ? '1' : '0.5';
  document.getElementById('exportJsonTab').style.opacity = f === 'json' ? '1' : '0.5';
  document.getElementById('exportContent').value = f === 'csv' ? generateCsv() : generateJson();
}

function openExport() {
  exportFormat = 'csv';
  document.getElementById('exportCsvTab').style.opacity = '1';
  document.getElementById('exportJsonTab').style.opacity = '0.5';
  document.getElementById('exportContent').value = generateCsv();
  document.getElementById('exportModal').hidden = false;
}

function closeExport() { document.getElementById('exportModal').hidden = true; }

function copyExport() {
  var text = document.getElementById('exportContent').value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('Copied to clipboard');
    }).catch(function() {
      document.getElementById('exportContent').select();
      showToast('Select all and copy manually', true);
    });
  } else {
    document.getElementById('exportContent').select();
    showToast('Select all and copy manually', true);
  }
}

function openEdit(idx) {
  editingOrder = idx;
  var order = orders[idx];
  editCart = order.items.map(function(i) { return { name: i.name, price: i.price, qty: i.qty }; });
  renderEditModal();
  document.getElementById('editModal').hidden = false;
  document.getElementById('editModalTitle').textContent = 'Edit ' + order.id;
}

function renderEditModal() {
  var body = document.getElementById('editModalBody');
  var total = getTotal(editCart);
  var html = '<div style="margin-bottom:16px">';

  editCart.forEach(function(item, i) {
    html += '<div class="cart-item">' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-name">' + item.name + '</div>' +
        '<div class="cart-item-price">' + fmt(item.price) + ' ea</div>' +
      '</div>' +
      '<div class="cart-qty">' +
        '<button class="qty-btn ' + (item.qty === 1 ? 'danger' : '') + '" onclick="editQty(' + i + ', -1)">' + (item.qty === 1 ? '&#10005;' : '&#8722;') + '</button>' +
        '<span class="qty-val">' + item.qty + '</span>' +
        '<button class="qty-btn" onclick="editQty(' + i + ', 1)">+</button>' +
      '</div>' +
      '<div class="cart-item-total">' + fmt(item.price * item.qty) + '</div>' +
    '</div>';
  });
  html += '</div>';

  html += '<div style="border-top:2px solid var(--border);padding-top:12px;margin-bottom:16px;">' +
    '<div class="cart-total"><span class="cart-total-label">New Total</span>' +
    '<span class="cart-total-value">' + fmt(total) + '</span></div></div>';

  html += '<details style="margin-top:8px"><summary style="font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:10px;">Add more items</summary>' +
    '<div style="max-height:200px;overflow-y:auto;">';
  MENU.forEach(function(cat) {
    html += '<div class="category-label">' + cat.category + '</div><div class="menu-grid" style="margin-bottom:12px">';
    cat.items.forEach(function(item) {
      html += '<div class="menu-item" onclick="editAddItem(\'' + item.name + '\', ' + item.price + ')">' +
        '<span class="menu-item-name">' + item.name + '</span>' +
        '<span class="menu-item-price">' + fmt(item.price) + '</span></div>';
    });
    html += '</div>';
  });
  html += '</div></details>';
  body.innerHTML = html;
}

function editQty(index, delta) {
  editCart[index].qty += delta;
  if (editCart[index].qty <= 0) editCart.splice(index, 1);
  renderEditModal();
}

function editAddItem(name, price) {
  var existing = editCart.find(function(i) { return i.name === name; });
  if (existing) { existing.qty++; }
  else { editCart.push({ name: name, price: price, qty: 1 }); }
  renderEditModal();
}

function saveEdit() {
  if (editingOrder === null) return;
  var order = orders[editingOrder];
  order.items = editCart.map(function(i) { return { name: i.name, price: i.price, qty: i.qty }; });
  order.total = getTotal(editCart);
  order.edited = true;
  order.editedDate = new Date().toISOString();
  saveOrders();
  renderHistory();
  closeEdit();
  showToast(order.id + ' updated');
}

function closeEdit() {
  document.getElementById('editModal').hidden = true;
  editingOrder = null;
  editCart = [];
}

function switchView(view) {
  var tabs = document.querySelectorAll('.header-tab');
  tabs[0].classList.toggle('active', view === 'pos');
  tabs[1].classList.toggle('active', view === 'history');
  document.getElementById('posView').style.display = view === 'pos' ? 'flex' : 'none';
  document.getElementById('historyView').className = 'history-view' + (view === 'history' ? ' active' : '');
  if (view === 'history') renderHistory();
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = 'toast'; }, 3000);
}

loadData();
renderMenu();
renderCart();
</script>
</body>
</html>
